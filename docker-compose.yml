services:
  postgres:
    image: postgres:16-alpine
    container_name: aprobaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aprobaflow
      POSTGRES_PASSWORD: aprobaflow_secret
      POSTGRES_DB: aprobaflow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aprobaflow -d aprobaflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: aprobaflow-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pg_data:
